databases:
  - name: tostado-postgres
    databaseName: tostado_cafeteria
    user: tostado
    plan: free
    region: ohio

services:
  - type: web
    name: tostado-cafeteria
    runtime: python
    plan: free
    region: ohio
    buildCommand: bash build.sh
    startCommand: gunicorn tostado.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tostado-postgres
          property: connectionString
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
